"""A physical mailing address — no independent identity, embeds with its parent."""
type Address {
  line1: String!
  line2: String
  city: String!
  postalCode: String!
  country: String!
}

"""One line item within an order — independently meaningful, gets its own identity."""
type LineItem @access(rules: [{ role: ADMIN, level: READ_WRITE }, { role: USER, level: READ_ONLY }]) {
  id: ID!
  sku: String! @validate(pattern: "^[A-Z]{3}-[0-9]{4}$")
  quantity: Int! @validate(min: 1)
  unitPriceCents: Int!
}

enum OrderStatus {
  DRAFT
  SUBMITTED
  FULFILLED
  CANCELLED
}

"""A customer's placed order."""
type Order @access(rules: [{ role: ADMIN, level: READ_WRITE }, { role: USER, level: READ_ONLY }]) {
  id: ID!
  status: OrderStatus!
  shippingAddress: Address!
  lineItems: [LineItem!]!
}

"""A label a customer can be tagged with."""
type Tag {
  id: ID!
  name: String!
  customers: [CustomerTag!]!
}

"""Join between Customer and Tag — many-to-many, documented explicitly. Not
implemented by the CDM; a real system might realize this as a join table
(relational) or an array field on one side (document)."""
type CustomerTag {
  id: ID!
  customer: Customer!
  tag: Tag!
  assignedAt: String!
}

"""A paying customer of record."""
type Customer @access(rules: [{ role: ADMIN, level: READ_WRITE }, { role: USER, level: READ_ONLY }]) {
  id: ID!
  email: String! @validate(format: "email", sensitivity: "pii")
  displayName: String!
  ssn: String
    @access(rules: [{ role: ADMIN, level: READ_ONLY }, { role: USER, level: NONE }])
    @validate(sensitivity: "pii")
  orders: [Order!]!
  tags: [CustomerTag!]!
}

input UpdateCustomerInput {
  id: ID!
  email: String
  displayName: String
}

type UpdateCustomerPayload {
  customer: Customer
  errors: [String!]
}

extend type Mutation {
  updateCustomer(input: UpdateCustomerInput!): UpdateCustomerPayload!
}
