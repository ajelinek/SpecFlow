# Shared directive declarations for this Common Data Model.
#
# This file is boilerplate — @access, @validate, AccessLevel, and AccessRule never
# change between projects. The only project-specific part is the Role enum's values,
# filled in once the project's actual access roles are known (see 103.5's Step 4).
#
# This schema is documentation only. It is never deployed as a live GraphQL API.

"""The actors who can read or write data in this domain. Replace ADMIN/USER below
with this project's real roles (e.g. OWNER, MEMBER, VIEWER) — resolved once via
gap-check, not guessed."""
enum Role {
  ADMIN
  USER
}

enum AccessLevel {
  READ_WRITE
  READ_ONLY
  NONE
}

input AccessRule {
  role: Role!
  level: AccessLevel!
}

"""Role-based access. Usable on a type (sets the default for all its fields) or on a
field (overrides the type's default — field-level always wins when present)."""
directive @access(rules: [AccessRule!]!) on OBJECT | FIELD_DEFINITION

"""Field-level data quality and sensitivity constraints. Required-ness is never an
argument here — it's expressed natively by GraphQL's `!` on the field's type. Only
include the specific constraint arguments that actually apply to a field; a plain
field with nothing to say stays undecorated. Need a constraint not listed here? See
103.5's SKILL.md, "On extending the directive vocabulary for project-specific
needs" — add a new argument below and document it the same way as the others."""
directive @validate(
  """String fields only. Minimum length, inclusive."""
  minLength: Int
  """String fields only. Maximum length, inclusive."""
  maxLength: Int
  """String fields only. A regular expression (ECMAScript flavor) the value must
  match."""
  pattern: String
  """String fields only. A named format the value must satisfy: "email", "url",
  "uuid", "date" (YYYY-MM-DD), "date-time" (ISO 8601), or "phone". Add a new value
  to this vocabulary in the project's own copy of this file if a domain needs a
  format not listed here, documented the same way."""
  format: String
  """String fields only. The value must start with this literal substring."""
  startsWith: String
  """String fields only. The value must end with this literal substring."""
  endsWith: String
  """String fields only. The value must contain this literal substring."""
  contains: String
  """String fields only. The value must NOT contain this literal substring."""
  notContains: String
  """Int/Float fields only. Minimum value, inclusive."""
  min: Float
  """Int/Float fields only. Maximum value, inclusive."""
  max: Float
  """Int/Float fields only. Minimum value, exclusive."""
  exclusiveMin: Float
  """Int/Float fields only. Maximum value, exclusive."""
  exclusiveMax: Float
  """Int/Float fields only. The value must be an exact multiple of this number."""
  multipleOf: Float
  """List fields only. Minimum number of items, inclusive."""
  minItems: Int
  """List fields only. Maximum number of items, inclusive."""
  maxItems: Int
  """Any field. The kind of sensitive data this field holds: "pii", "financial",
  "confidential", or a freeform value if none fit. Drives downstream handling
  (encryption at rest, audit logging, redaction in logs) — not a format or range
  constraint."""
  sensitivity: String
) on FIELD_DEFINITION

"""Documentation-only placeholder root — this schema is never executed as an API, so
there is no real Query type to author. Do not add fields here; domains never need to
extend Query for a CDM (list fields live on entity types, not a root query)."""
type Query {
  _: Boolean
}

"""Documentation-only placeholder root. Domains attach their mutations with
`extend type Mutation { ... }` — never declare `type Mutation` yourself in a domain
schema file, always extend this one."""
type Mutation {
  _: Boolean
}
